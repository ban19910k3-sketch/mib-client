<!DOCTYPE html><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;font-family:"Segoe UI",sans-serif}html,body{background:transparent;overflow:hidden;height:100%;user-select:none}
#menu{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:460px;max-height:80vh;overflow:auto;background:#12041dee;border:1px solid #a855f7;border-radius:16px;padding:18px;color:#f3e8ff;box-shadow:0 0 40px #7c3aed88}
.menu #menu{display:block}h3{margin-bottom:4px}small{color:#9b86b3;display:block;margin-bottom:12px}
.r{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}.r span{flex:1}.r em{font-size:11px;color:#c084fc;font-style:normal}
button{background:#7c3aed;color:#fff;border:0;border-radius:8px;padding:6px 14px;cursor:pointer;margin-top:10px}</style>
<div id="menu"><h3>MiB Client</h3><small>Zmiana konta uruchamia grę ponownie (Minecraft nie pozwala zmienić konta w trakcie sesji).</small><div id="acc"></div><button id="x">Zamknij</button><small id="msg" style="margin-top:8px"></small></div>
<script>
const $=i=>document.getElementById(i);
async function accs(){const l=await mib.call('accounts:list');$('acc').innerHTML=l.map(a=>`<div class="r"><span>${String(a.name).replace(/</g,'&lt;')}</span>${a.active?'<em>aktywne</em>':`<button data-a="${String(a.id).replace(/[^\w-]/g,'')}">Przełącz</button>`}</div>`).join('')||'<em>Brak kont</em>'}
$('acc').onclick=async e=>{const id=e.target.dataset.a;if(!id)return;$('msg').textContent='Zmieniam konto…';$('msg').textContent=await mib.call('accounts:relaunch',id)};
$('x').onclick=()=>mib.call('hud:close');
mib.on('menu',v=>{document.body.classList.toggle('menu',v);$('msg').textContent='';if(v)accs()});
</script>
