// Kopia moda MiB dla jednej wersji gry (katalog versions/<wersja>). Źródło adaptera jest jedno (fabric/src)
// z blokami //#if MC >= x.y.z, które MibPp (buildSrc) wycina pod tę wersję do build/pp. Część wspólna (common)
// kompiluje się razem z nim.
def mc = project.minecraft_version
def unobf = MibPp.cmp(mc, '26.1') >= 0          // od 26.1: bez remapowania, Java 25
def javaVer = unobf ? 25 : 21
def hasGametest = MibPp.cmp(mc, '1.21.4') >= 0  // Fabric API ma test klienta od 1.21.4

base {
	archivesName = "mib-mod-fabric-$mc"
}

dependencies {
	minecraft "com.mojang:minecraft:${mc}"
	if (unobf) {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	} else {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
}

// Automatyczny test gry (fabric/src/gametest): uruchamia klienta, otwiera menu i robi zrzuty ekranu
if (hasGametest) {
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = 'mibclient-gametest'
			enableGameTests = false
			enableClientGameTests = true
			eula = true
		}
	}
	// Na CI (renderowanie programowe) synchronizacja pakietów i łączenie stosów wywołań spowalniają wczytywanie świata
	tasks.matching { it.name == 'runClientGameTest' }.configureEach {
		jvmArgs '-Dfabric.client.gametest.disableNetworkSynchronizer=true', '-Dfabric.client.gametest.disableJoinAsyncStackTraces=true'
	}
}

// -PwithMods: test gry razem z modami, które launcher instaluje obok moda MiB (Sodium i mody na więcej FPS),
// każdy w najnowszej wersji z Modrinth dla tej wersji gry (bez wersji — test bez niego)
if (project.hasProperty('withMods')) {
	repositories {
		exclusiveContent {
			forRepository { maven { url = 'https://api.modrinth.com/maven' } }
			filter { includeGroup 'maven.modrinth' }
		}
	}
	def modrinth = { String path ->
		def conn = new URL("https://api.modrinth.com/v2$path").openConnection()
		conn.setRequestProperty('User-Agent', 'MiB-Client-CI (github.com/ban19910k3-sketch/mib-client)')
		new groovy.json.JsonSlurper().parse(conn.inputStream)
	}
	def query = "loaders=%5B%22fabric%22%5D&game_versions=%5B%22$mc%22%5D"
	def added = [] as Set
	// jak launcher: razem z modem jego wymagane biblioteki (np. Transition dla Entity Culling), bez Fabric API (już jest)
	def add
	add = { String project, version ->
		if (version == null || !added.add(project)) return
		logger.lifecycle("MiB: test z $project ${version.version_number}")
		dependencies { if (unobf) runtimeOnly "maven.modrinth:$project:${version.id}" else modLocalRuntime "maven.modrinth:$project:${version.id}" }
		version.dependencies.findAll { it.dependency_type == 'required' && it.project_id && it.project_id != 'P7dR8mSH' }.each { d ->
			add(d.project_id, d.version_id ? modrinth("/version/${d.version_id}") : modrinth("/project/${d.project_id}/version?$query")[0])
		}
	}
	['sodium', 'lithium', 'ferrite-core', 'entityculling', 'immediatelyfast'].each { slug ->
		def list = modrinth("/project/$slug/version?$query")
		if (list) add(list[0].project_id, list[0])
		else logger.lifecycle("MiB: $slug nie ma wersji dla $mc")
	}
}

// Starsze wersje bez testu klienta: -Psmoke uruchamia grę, mod sam otwiera menu i edytor HUD, wypisuje [MIB-SMOKE] i zamyka grę
if (project.hasProperty('smoke')) {
	loom {
		runs {
			client {
				vmArg '-Dmib.smoketest=true'
			}
		}
	}
}

def ppDir = layout.buildDirectory.dir('pp').get().asFile
def ppSrc = rootProject.file('fabric/src')
tasks.register('mibPreprocess') {
	inputs.dir(ppSrc)
	inputs.property('mc', mc)
	outputs.dir(ppDir)
	doLast {
		MibPp.tree(ppSrc, ppDir, mc)
	}
}

// Efekty pełnoekranowe (Color saturation, Motion blur) mają inny format w każdej rodzinie wersji (mod/tools/shaders.py)
def shaderFamily = MibPp.cmp(mc, '26.3') >= 0 ? 'f6' : MibPp.cmp(mc, '26.1') >= 0 ? 'f5' : MibPp.cmp(mc, '1.21.6') >= 0 ? 'f4'
		: MibPp.cmp(mc, '1.21.5') >= 0 ? 'f3' : MibPp.cmp(mc, '1.21.2') >= 0 ? 'f2' : 'f1'

sourceSets {
	main {
		java.srcDirs = [new File(ppDir, 'main/java'), rootProject.file('common/src/main/java')]
		resources.srcDirs = [new File(ppDir, 'main/resources'), rootProject.file('common/src/main/resources'), rootProject.file("fabric/shaders/$shaderFamily")]
	}
}
if (hasGametest) {
	sourceSets {
		gametest {
			java.srcDirs = [new File(ppDir, 'gametest/java')]
			resources.srcDirs = [new File(ppDir, 'gametest/resources')]
		}
	}
}
tasks.matching { it.name in ['compileJava', 'processResources', 'compileGametestJava', 'processGametestResources', 'sourcesJar'] }.configureEach {
	dependsOn 'mibPreprocess'
}

processResources {
	def props = [version: project.version, mc: mc, java: javaVer]
	inputs.properties(props)
	filesMatching(['fabric.mod.json', 'mibclient.mixins.json']) {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVer
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaVer)
	targetCompatibility = JavaVersion.toVersion(javaVer)
}

// Stała nazwa pliku: launcher kopiuje go do mods jako mib-client-mod.jar
tasks.named(unobf ? 'jar' : 'remapJar') {
	archiveFileName = "mib-mod-fabric-${mc}.jar"
}
