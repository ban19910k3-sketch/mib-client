# Podgląd klas Minecrafta (pomoc przy dopisywaniu nowych wersji gry): uruchamia się po zmianie .github/probe.txt.
# Każda wersja gry osobno (osobny limit adnotacji).
name: Podgląd klas gry

on:
  push:
    paths: ['.github/probe.txt', '.github/probe.sh', '.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.v.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: echo "list=$(awk '!/^#/ && NF {print $1}' .github/probe.txt | sort -u | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  probe:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.list) }}
    name: ${{ matrix.mc }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: bash .github/probe.sh ${{ matrix.mc }}
