# Buduje mod MiB dla każdej wersji gry (1.21–26.3, osobne zadania równolegle) i sprawdza go w prawdziwym kliencie:
# od 1.21.4 automatyczny test Fabric ze zrzutami (artefakt "zrzuty-<wersja>"), starsze: test uruchomienia
# (gra otwiera menu i edytor HUD, potem sama się zamyka). Przy błędzie najważniejsze linie logu trafiają do adnotacji.
name: Mod MiB

on:
  push:
    paths: ['mod/**', '.github/workflows/mod.yml', '.github/workflows/annotate.sh']
  workflow_dispatch:
    inputs:
      versions:
        description: 'Wersje gry po przecinku (puste = wszystkie)'
        required: false
      without:
        description: 'Mody z Modrinth pominięte w teście, po przecinku (np. sodium) — do szukania moda, który psuje grę'
        required: false

jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Część wspólna i bloki wersji
        working-directory: mod
        run: ./gradlew -PcommonOnly :common:test mibPpCheck --stacktrace

  # lista wersji gry = katalogi mod/versions/<wersja>
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.v.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        env:
          WANT: ${{ github.event.inputs.versions }}
        run: |
          if [ -n "$WANT" ]; then echo "list=$(echo "$WANT" | jq -R -c 'split(",") | map(gsub(" "; ""))')" >> "$GITHUB_OUTPUT"
          else echo "list=$(ls mod/versions | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"; fi

  version:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.list) }}
    name: ${{ matrix.mc }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers
      - name: Zbuduj
        shell: bash
        working-directory: mod
        run: |
          set -o pipefail
          ./gradlew -Pmc=${{ matrix.mc }} :mc-${{ matrix.mc }}:build --stacktrace 2>&1 | tee build.log
      - name: Test w kliencie gry
        shell: bash
        working-directory: mod
        run: |
          set -o pipefail
          # każda wersja w innym motywie świątecznym (od 0.25.0), żeby test sprawdził ozdoby wszystkich świąt w prawdziwej grze
          THEMES=(halloween boze sylwester walentynki wielkanoc primaaprilis urodzinymc dziendziecka wakacje urodzinymib niepodleglosc none)
          IDX=$(ls versions | grep -nxF "${{ matrix.mc }}" | cut -d: -f1)
          THEME=${THEMES[$(( (IDX - 1) % ${#THEMES[@]} ))]}
          echo "Motyw w teście: $THEME"
          if [[ "${{ matrix.mc }}" =~ ^1\.21(\.[123])?$ ]]; then
            timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -Pmc=${{ matrix.mc }} -PmibTheme=$THEME -Psmoke -PwithMods -PwithoutMods="${{ github.event.inputs.without }}" :mc-${{ matrix.mc }}:runClient --stacktrace 2>&1 | tee test.log
            grep -q "\[MIB-SMOKE\] menu true" test.log && grep -q "\[MIB-SMOKE\] hud true" test.log && grep -q "\[MIB-SMOKE\] ok" test.log \
              || { echo "::error::Test uruchomienia nie przeszedł"; exit 1; }
          elif [[ "${{ matrix.mc }}" =~ ^26\.([3-9]|[1-9][0-9]) ]]; then
            # od 26.3 gra używa SDL: test bez xvfb, jak w CI samego Fabric
            timeout 1500 ./gradlew -Pmc=${{ matrix.mc }} -PmibTheme=$THEME -PwithMods -PwithoutMods="${{ github.event.inputs.without }}" :mc-${{ matrix.mc }}:runClientGameTest --stacktrace 2>&1 | tee test.log
          else
            timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -Pmc=${{ matrix.mc }} -PmibTheme=$THEME -PwithMods -PwithoutMods="${{ github.event.inputs.without }}" :mc-${{ matrix.mc }}:runClientGameTest --stacktrace 2>&1 | tee test.log
          fi
      - name: Błędy jako adnotacje
        if: failure()
        shell: bash
        working-directory: mod
        run: bash ../.github/workflows/annotate.sh "$(ls -t test.log build.log 2>/dev/null | head -1)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zrzuty-${{ matrix.mc }}
          if-no-files-found: ignore
          path: |
            mod/versions/${{ matrix.mc }}/**/screenshots/*.png
            mod/versions/${{ matrix.mc }}/build/libs/mib-mod-fabric-*.jar
            mod/test.log
