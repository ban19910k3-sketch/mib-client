# Buduje mod MiB (część wspólna + kopie wersji) i uruchamia automatyczny test w prawdziwym kliencie Minecrafta.
# Zrzuty ekranu z testu są do pobrania w zakładce Actions (artefakt "zrzuty-1.21.11").
name: Mod MiB

on:
  push:
    paths: ['mod/**', '.github/workflows/mod.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --stacktrace
        working-directory: mod
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: mod/fabric-1.21.11/build/libs/mib-mod-fabric-1.21.11.jar

  client-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric-1.21.11:runClientGameTest --stacktrace
        working-directory: mod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty-1.21.11
          path: |
            mod/fabric-1.21.11/**/screenshots/*.png
            mod/fabric-1.21.11/**/logs/latest.log
            mod/fabric-1.21.11/**/crash-reports/*.txt
