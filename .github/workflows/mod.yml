# Buduje mod MiB (część wspólna + kopie wersji) i uruchamia automatyczny test w prawdziwym kliencie Minecrafta.
# Zrzuty ekranu z testu są do pobrania w zakładce Actions (artefakt "zrzuty-1.21.11").
# Przy błędzie najważniejsze linie logu trafiają do adnotacji (widać je w podsumowaniu przebiegu).
name: Mod MiB

on:
  push:
    paths: ['mod/**', '.github/workflows/mod.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Zbuduj
        shell: bash
        working-directory: mod
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Błędy jako adnotacje
        if: failure()
        shell: bash
        working-directory: mod
        run: bash ../.github/workflows/annotate.sh build.log
      - uses: actions/upload-artifact@v7
        with:
          name: mod-jar
          path: mod/fabric-1.21.11/build/libs/mib-mod-fabric-1.21.11.jar

  client-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test w kliencie gry
        shell: bash
        working-directory: mod
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric-1.21.11:runClientGameTest --stacktrace 2>&1 | tee test.log
      - name: Błędy jako adnotacje
        if: failure()
        shell: bash
        working-directory: mod
        run: bash ../.github/workflows/annotate.sh test.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zrzuty-1.21.11
          path: |
            mod/fabric-1.21.11/**/screenshots/*.png
            mod/fabric-1.21.11/**/logs/latest.log
            mod/fabric-1.21.11/**/crash-reports/*.txt
            mod/test.log
