# Launcher na Maca (od 0.42.0): testy logiki, budowanie dmg i zip (Intel + Apple w jednej aplikacji, podpis ad-hoc bez
# konta Apple Developer) i test na prawdziwym Macu z procesorem Apple: zbudowany launcher startuje, aktualizacja z zipa
# podmienia aplikację, Java pobiera się na Maca, Minecraft startuje (test/e2e/mac.e2e.js). Wyniki w adnotacjach przebiegu.
name: Launcher na Maca

on:
  push:
    paths: ['*.js', '*.html', '*.css', 'lib/**', 'package.json', 'package-lock.json', 'build/adhoc.js', 'test/**', '.github/workflows/mac.yml']
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # druga próba po chwilowym błędzie obrazu dmg (hdiutil: Resource busy)
      - name: Zbuduj dmg i zip
        run: npx electron-builder --mac --universal --publish never || { sleep 15; npx electron-builder --mac --universal --publish never; }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: npm i -g playwright@1.56.1
      - name: Test na Macu
        run: node test/e2e/mac.e2e.js
