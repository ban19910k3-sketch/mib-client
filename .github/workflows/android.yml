# MiB Client na Androida (od 0.43.0): Amethyst (LGPL-3.0, wersja przypięta niżej) + zmiany MiB (android/mib.py) + mod MiB,
# Fabric API i profil Fabric dla Minecrafta $MC w paczce. Buduje APK i sprawdza go w emulatorze Androida (zrzut ekranu
# w adnotacji). Z release.yml (release: true) wrzuca MiB-Client-android.apk do szkicu wydania — podpisany kluczem MiB
# (android/mib.p12, hasło w sekrecie MIB_KEY_PASSWORD; bez sekretu wydanie na Androida się nie zbuduje).
name: Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      apk_run:
        description: 'Numer przebiegu z gotowym APK — wtedy tylko test w emulatorze'
        required: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

env:
  AMETHYST: 28d6e12d68121b7dd75f2e841058a6b7cdfe4a29
  MC: 1.21.11

jobs:
  apk:
    if: ${{ !inputs.apk_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            25
            21
      # klucz podpisu od razu: brak sekretu albo złe hasło wychodzi przed długim budowaniem
      - name: Klucz podpisu
        env:
          MIB_KEY_PASSWORD: ${{ secrets.MIB_KEY_PASSWORD }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -z "$MIB_KEY_PASSWORD" ]; then
            if [ "$RELEASE" = true ]; then echo "::error::Brak sekretu MIB_KEY_PASSWORD (Settings → Secrets and variables → Actions) — APK na Androida nie zostanie wydany"; exit 1; fi
            exit 0
          fi
          keytool -list -keystore android/mib.p12 -storetype PKCS12 -storepass "$MIB_KEY_PASSWORD" -alias mib > /dev/null \
            || { echo "::error::Sekret MIB_KEY_PASSWORD nie pasuje do klucza android/mib.p12 (sprawdź, czy wklejone bez spacji)"; exit 1; }
          echo "::notice::Klucz podpisu MiB działa"
      - uses: gradle/actions/setup-gradle@v6
      - name: Mod MiB
        working-directory: mod
        run: ./gradlew -Pmc=$MC :mc-$MC:build --no-daemon || { sleep 30; ./gradlew -Pmc=$MC :mc-$MC:build --no-daemon --refresh-dependencies; }
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
      - name: Fabric i Fabric API
        run: |
          mkdir -p mibin
          loader=$(curl -fsS "https://meta.fabricmc.net/v2/versions/loader/$MC" | jq -r '[.[] | select(.loader.stable)][0].loader.version')
          curl -fsS -o mibin/fabric.json "https://meta.fabricmc.net/v2/versions/loader/$MC/$loader/profile/json"
          api=$(curl -fsS -G "https://api.modrinth.com/v2/project/fabric-api/version" --data-urlencode "loaders=[\"fabric\"]" --data-urlencode "game_versions=[\"$MC\"]" | jq -c '.[0].files[] | select(.primary)')
          curl -fsS -o "mibin/$(jq -r .filename <<<"$api")" "$(jq -r .url <<<"$api")"
          ls -la mibin
      - name: Amethyst
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git init -q amethyst && cd amethyst
          git fetch -q --depth 1 https://github.com/AngelAuraMC/Amethyst-Android "$AMETHYST" && git checkout -q FETCH_HEAD
          git submodule update --init --recursive
      # Java 8 do paczki (jak w Amethyst); Javę 17/21/25 aplikacja pobiera sama, gdy gra jej potrzebuje. (Część Amethyst
      # buduje się Javą 8 — stąd 8 w setup-java i org.gradle.java.installations.fromEnv.)
      - uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: amethyst/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
      - name: Zmiany MiB
        run: |
          pip install -q pillow
          v=$(node -p "require('./package.json').version")
          python3 android/mib.py --src amethyst --version "$v" --mod "mod/versions/$MC/build/libs/mib-mod-fabric-$MC.jar" \
            --fabric-api "$(ls mibin/fabric-api-*.jar)" --fabric-profile mibin/fabric.json --icon icon.png
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"
      - name: Zbuduj APK
        working-directory: amethyst
        env:
          MIB_KEY_PASSWORD: ${{ secrets.MIB_KEY_PASSWORD }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$MIB_KEY_PASSWORD" ]; then export MIB_KEYSTORE="$GITHUB_WORKSPACE/android/mib.p12"
          elif [ "$RELEASE" = true ]; then echo "::error::Brak sekretu MIB_KEY_PASSWORD (hasło klucza android/mib.p12) — APK na Androida nie zostanie wydany"; exit 1
          else echo "::warning::Brak sekretu MIB_KEY_PASSWORD — APK testowy podpisany kluczem debug"; fi
          set -o pipefail
          ./scripts/languagelist_updater.sh
          gradle :app_pojavlauncher:assembleRelease --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64 2>&1 | tee ../build.log
          mkdir -p ../out && mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk ../out/MiB-Client-android.apk
          ls -la ../out
      - name: Błędy jako adnotacje
        if: failure()
        run: '[ -f build.log ] && bash .github/workflows/annotate.sh build.log'
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: out/MiB-Client-android.apk
          if-no-files-found: error
      - name: Do szkicu wydania
        if: inputs.release
        run: gh release upload "v$(node -p "require('./package.json').version")" out/MiB-Client-android.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # emulator: aplikacja startuje, profil MiB z modem gotowy, bez awarii; zrzut ekranu w adnotacji (mały JPEG w base64)
  emulator:
    needs: apk
    if: ${{ !cancelled() && !inputs.release && (needs.apk.result == 'success' || inputs.apk_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          run-id: ${{ inputs.apk_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: KVM i skrypt testu
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          pip install -q pillow
          cat > test.sh <<'EOF'
          set -u
          P=pl.mibclient.android
          note() { printf '%s' "$2" | cut -c1-3900 | sed -e 's/%/%25/g' | awk -v t="$1" 'BEGIN{ORS="%0A"} NR==1{printf "::notice title=%s::", t} {print}'; echo; }
          shot() { adb exec-out screencap -p > "$1.png"; python3 - "$1" <<'PY'
          import base64, io, sys
          from PIL import Image
          im = Image.open(sys.argv[1] + '.png').convert('RGB'); im.thumbnail((300, 300))
          b = io.BytesIO(); im.save(b, 'JPEG', quality=40); d = base64.b64encode(b.getvalue()).decode()
          parts = [d[i:i + 3900] for i in range(0, len(d), 3900)]
          for i, p in enumerate(parts): print(f'::notice title={sys.argv[1]}-{i + 1}-{len(parts)}::{p}')
          PY
          }
          adb logcat -G 16M || true
          note install "$(adb install -r MiB-Client-android.apk 2>&1)"
          adb shell pm grant $P android.permission.POST_NOTIFICATIONS || true
          adb logcat -c
          note start "$(adb shell am start -W -n $P/net.kdt.pojavlaunch.TestStorageActivity 2>&1)"
          sleep 60
          shot zrzut
          adb logcat -d > logcat.txt || true
          ps=$(adb shell ps -A | grep -i mibclient || true)
          mods=$(adb shell ls -la /sdcard/Android/data/$P/files/custom_instances/mib/mods 2>&1 || true)
          note proces "$ps"
          note mody "$mods"
          note logi-mib "$(grep -E ' (MiB|AndroidRuntime|DEBUG) *:' logcat.txt | tail -40)"
          ok=1
          [ -n "$ps" ] || { echo "::error::MiB Client nie działa po starcie"; ok=0; }
          if grep -q "FATAL EXCEPTION" logcat.txt; then echo "::error::awaria: $(grep -A10 'FATAL EXCEPTION' logcat.txt | tr '\n' ' ' | cut -c1-3500)"; ok=0; fi
          grep -q "profil MiB gotowy" logcat.txt || { echo "::error::brak wpisu 'profil MiB gotowy' w logu"; ok=0; }
          echo "$mods" | grep -q mib-client-mod.jar || { echo "::error::brak moda MiB w folderze gry"; ok=0; }
          echo "$mods" | grep -q "fabric-api-" || { echo "::error::brak Fabric API w folderze gry"; ok=0; }
          [ $ok = 1 ] && echo "::notice::PASS Android: aplikacja startuje, profil MiB z modem i Fabric API"
          [ $ok = 1 ]
          EOF
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash test.sh
