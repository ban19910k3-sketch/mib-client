# Launcher na Maca (od 0.42.0) i Linuksa (od 0.43.0): testy logiki, budowanie i test zbudowanej aplikacji na prawdziwym
# systemie (test/e2e/dist.e2e.js): launcher startuje, aktualizacje, Java pobiera się na ten system, Minecraft startuje.
# Mac: dmg i zip (Intel + Apple w jednej aplikacji, podpis ad-hoc bez konta Apple Developer), Mac z procesorem Apple.
# Linux: AppImage z latest-linux.yml. Wyniki w adnotacjach przebiegu.
name: Launcher na Maca i Linuksa

on:
  push:
    paths: ['*.js', '*.html', '*.css', 'lib/**', 'package.json', 'package-lock.json', 'build/afterpack.js', 'build/DockAgent.java', 'build/dock-agent.sh', 'test/**', '.github/workflows/desktop.yml', '.github/workflows/retry.sh']
  workflow_dispatch:

jobs:
  # Mac z procesorem Apple i Mac z Intelem (od 0.47.0: ta sama aplikacja na oba, a maszyny Apple na GitHubie bywają
  # niedostępne przez długą kolejkę)
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: bash .github/workflows/retry.sh npm ci
      - run: npm test
      # druga próba po chwilowym błędzie obrazu dmg (hdiutil: Resource busy)
      - name: Zbuduj dmg i zip
        run: bash .github/workflows/retry.sh npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: bash .github/workflows/retry.sh npm i -g playwright@1.56.1
      - name: Test na Macu
        run: node test/e2e/dist.e2e.js
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: bash .github/workflows/retry.sh npm ci
      - name: Zbuduj AppImage
        run: bash .github/workflows/retry.sh npx electron-builder --linux AppImage --x64 --publish never
      - run: bash .github/workflows/retry.sh npm i -g playwright@1.56.1
      - name: Test na Linuksie
        run: xvfb-run -a node test/e2e/dist.e2e.js

  # Postać 3D w Kosmetykach (od 0.47.3): nie znika przy klikaniu i po 20 oknach zakupu, skin i peleryna wczytują się raz
  # (test/e2e/skin.e2e.js, wynik w adnotacji) — na każdym systemie, bo WebGL rysuje inna karta graficzna
  skin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: bash .github/workflows/retry.sh npm ci
        shell: bash
      - run: bash .github/workflows/retry.sh npm i -g playwright@1.56.1
        shell: bash
      - name: Postać 3D w Kosmetykach
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node test/e2e/skin.e2e.js; else node test/e2e/skin.e2e.js; fi

  # Ikona Minecrafta na pasku zadań / w Docku (od 0.47.0): stara (LWJGL 2), średnia i najnowsza wersja gry na każdym systemie
  icon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: bash .github/workflows/retry.sh npm ci
        shell: bash
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils x11-xserver-utils mesa-utils
      # Windows bez karty graficznej: OpenGL z Mesa (llvmpipe) obok javaw.exe
      - if: runner.os == 'Windows'
        name: Mesa (OpenGL bez karty graficznej)
        shell: bash
        run: |
          bash .github/workflows/retry.sh gh release download --repo pal1000/mesa-dist-win --pattern '*release-msvc.7z' --dir mesa
          7z x -omesa mesa/*.7z > /dev/null
          echo "MESA_DIR=$(cygpath -w "$PWD/mesa/x64")" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Ikona w grze
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1280x720x24" node test/e2e/icon.e2e.js; else node test/e2e/icon.e2e.js; fi
        env:
          GALLIUM_DRIVER: llvmpipe

