# Buduje instalator Windows i wrzuca go razem z latest.yml do szkicu wydania v<wersja z package.json>, potem launcher
# na Maca (dmg i zip) i na Linuksa (AppImage z latest-linux.yml) do tego samego szkicu.
# Szkic nie trafia do graczy, dopóki ktoś nie kliknie "Publish release" na GitHubie.
name: Zbuduj wydanie

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # lista wersji gry = katalogi mod/versions/<wersja>
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.v.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: echo "list=$(ls mod/versions | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  # mod MiB do gry (menu pod prawym Shiftem), osobny plik dla każdej wersji gry
  mod:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # do 4 prób po chwilowych błędach pobierania (serwery Mavena, limit zapytań); od drugiej biblioteki od nowa
      - name: Zbuduj mod
        shell: bash
        working-directory: mod
        run: |
          bash ../.github/workflows/retry.sh bash -c 'set -o pipefail; ./gradlew -Pmc=${{ matrix.mc }} :mc-${{ matrix.mc }}:build --no-daemon $([ "$MIB_TRY" -gt 0 ] && echo --refresh-dependencies) 2>&1 | tee build.log'
      - name: Błędy jako adnotacje
        if: failure()
        shell: bash
        working-directory: mod
        run: bash ../.github/workflows/annotate.sh build.log
      - uses: actions/upload-artifact@v7
        with:
          name: mod-${{ matrix.mc }}
          path: mod/versions/${{ matrix.mc }}/build/libs/mib-mod-fabric-${{ matrix.mc }}.jar
          if-no-files-found: error

  build:
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: bash .github/workflows/retry.sh npm ci
        shell: bash
      # pliki moda trafiają do instalatora jako resources/mod
      - uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          merge-multiple: true
          path: mod-dist
      # Opis zmian w oknie aktualizacji launchera: build/release-notes.md tej wersji (Dodane / Zmienione / Usunięte), bez linków i podpisów
      - name: Opis zmian
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          head -1 build/release-notes.md | tr -d '\r' | grep -qx "<!-- $v -->" || { echo "::error::build/release-notes.md nie opisuje wersji $v (pierwsza linia: <!-- $v -->)"; exit 1; }
          if grep -qiE 'https?://|co-authored-by|claude-session' build/release-notes.md; then echo "::error::build/release-notes.md: bez linków i podpisów"; exit 1; fi
      # electron-builder przy ponownej próbie nadpisuje pliki już wysłane do szkicu
      - run: bash .github/workflows/retry.sh npx electron-builder --win nsis --x64 --publish always
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ten sam opis na stronie szkicu wydania (electron-builder wpisuje go tylko do latest.yml)
      - name: Opis na stronie wydania
        shell: bash
        run: bash .github/workflows/retry.sh gh release edit "v$(node -p "require('./package.json').version")" --notes-file build/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Launcher na Maca (od 0.42.0, Intel + Apple, podpis ad-hoc bez konta Apple Developer) do tego samego szkicu:
  # MiB-Client-mac.dmg (stały link na stronę MiB: releases/latest/download/MiB-Client-mac.dmg) i
  # MiB-Client-<wersja>-mac.zip (z niego launcher na Macu sam się aktualizuje). Po Windows, żeby szkic już istniał.
  mac:
    needs: [mod, build]
    # Mac z Intelem buduje tę samą aplikację universal; maszyny Apple na GitHubie bywają niedostępne (długa kolejka,
    # zadanie anulowane), a wtedy wydanie nie miałoby plików na Maca
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: bash .github/workflows/retry.sh npm ci
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          merge-multiple: true
          path: mod-dist
      - name: Agent Docka (ikona Minecrafta w Docku dla gier na GLFW)
        run: bash build/dock-agent.sh mod-dist
      - name: Zbuduj dmg i zip
        run: bash .github/workflows/retry.sh npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Do szkicu wydania
        run: |
          v=$(node -p "require('./package.json').version")
          bash .github/workflows/retry.sh gh release upload "v$v" dist/MiB-Client-mac.dmg "dist/MiB-Client-$v-mac.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Launcher na Linuksa (od 0.43.0): MiB-Client-linux.AppImage (stały link na stronę MiB:
  # releases/latest/download/MiB-Client-linux.AppImage) i latest-linux.yml — z niego aktualizacje jak na Windows
  linux:
    needs: [mod, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: bash .github/workflows/retry.sh npm ci
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          merge-multiple: true
          path: mod-dist
      - run: bash .github/workflows/retry.sh npx electron-builder --linux AppImage --x64 --publish never
      - name: Do szkicu wydania
        run: bash .github/workflows/retry.sh gh release upload "v$(node -p "require('./package.json').version")" dist/MiB-Client-linux.AppImage dist/latest-linux.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
