# Buduje instalator Windows i wrzuca go razem z latest.yml do szkicu wydania v<wersja z package.json>.
# Szkic nie trafia do graczy, dopóki ktoś nie kliknie "Publish release" na GitHubie.
name: Zbuduj wydanie

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # lista wersji gry = katalogi mod/versions/<wersja>
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.v.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: echo "list=$(ls mod/versions | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  # mod MiB do gry (menu pod prawym Shiftem), osobny plik dla każdej wersji gry
  mod:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # druga próba po chwilowym błędzie pobierania (np. limit zapytań repozytorium)
      - name: Zbuduj mod
        shell: bash
        working-directory: mod
        run: |
          set -o pipefail
          ./gradlew -Pmc=${{ matrix.mc }} :mc-${{ matrix.mc }}:build --no-daemon 2>&1 | tee build.log \
            || { sleep 30; ./gradlew -Pmc=${{ matrix.mc }} :mc-${{ matrix.mc }}:build --no-daemon --refresh-dependencies 2>&1 | tee build.log; }
      - name: Błędy jako adnotacje
        if: failure()
        shell: bash
        working-directory: mod
        run: bash ../.github/workflows/annotate.sh build.log
      - uses: actions/upload-artifact@v7
        with:
          name: mod-${{ matrix.mc }}
          path: mod/versions/${{ matrix.mc }}/build/libs/mib-mod-fabric-${{ matrix.mc }}.jar
          if-no-files-found: error

  build:
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # pliki moda trafiają do instalatora jako resources/mod
      - uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          merge-multiple: true
          path: mod-dist
      # Opis zmian w oknie aktualizacji launchera: build/release-notes.md tej wersji (Dodane / Zmienione / Usunięte), bez linków i podpisów
      - name: Opis zmian
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          head -1 build/release-notes.md | tr -d '\r' | grep -qx "<!-- $v -->" || { echo "::error::build/release-notes.md nie opisuje wersji $v (pierwsza linia: <!-- $v -->)"; exit 1; }
          if grep -qiE 'https?://|co-authored-by|claude-session' build/release-notes.md; then echo "::error::build/release-notes.md: bez linków i podpisów"; exit 1; fi
      - run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ten sam opis na stronie szkicu wydania (electron-builder wpisuje go tylko do latest.yml)
      - name: Opis na stronie wydania
        shell: bash
        run: gh release edit "v$(node -p "require('./package.json').version")" --notes-file build/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
